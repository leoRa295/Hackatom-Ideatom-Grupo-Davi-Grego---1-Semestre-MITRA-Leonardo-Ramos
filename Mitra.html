 {name:'Hospital das Clínicas',addr:'Cerqueira César',lat:-23.5567,lng:-46.6700},
 {name:'Shopping Eldorado',addr:'Pinheiros',lat:-23.5727,lng:-46.6960},
 {name:'Estação Paraíso',addr:'Paraíso',lat:-23.5889,lng:-46.6407},

];
const ORIGIN={name:'Minha localização',lat:-23.5614,lng:-46.6559};
const BRL=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const rad=x=>x*Math.PI/180;
const hav=(a,b)=>{const dl=rad(b.lat-a.lat),dg=rad(b.lng-a.lng),q=Math.sin(dl/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dg/2)**2;return 12742*Math.asin(Math.sqrt(q))};

function along(p,d){let acc=0;for(let i=1;i<p.length;i++){const l=hav(p[i-1],p[i]);if(acc+l>=d||i===p.length-1){const t=l?Math.min(1,Math.max(0,(d-acc)/l)):1;return{lat:p[i-1].lat+(p[i].lat-p[i-1].lat)*t,lng:p[i-1].lng+(p[i].lng-p[i-1].lng)*t}}acc+=l}return p[p.length-1]}

const ICON={car:'<path d="M5 17v-4l2-5h10l2 5v4M5 17h14M7.5 17v2M16.5 17v2M7 13h10" />',star:'<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>'};

const M={lat:-23.5614,lng:-46.6559,z:14.6,w:390,h:280};
const D={lines:[],marks:[]};

function toS(p){const c=px(M,M.z),q=px(p,M.z);return{x:q.x-c.x+M.w/2,y:q.y-c.y+M.h/2}}
function fromS(x,y){const c=px(M,M.z);return unpx(c.x+x-M.w/2,c.y+y-M.h/2,M.z)}
function draw(){
 size();const z=M.z,step=.004,tl=fromS(0,0),br=fromS(M.w,M.h),rw=Math.max(1.4,Math.pow(2,z-14)*5);
 let g='';
 for(let la=Math.floor(br.lat/step)*step;la<=tl.lat+step;la+=step){const y=toS({lat:la,lng:M.lng}).y,mj=Math.round(la/step)%4===0;g+=`<path d="M0 ${y.toFixed(1)}H${M.w}" stroke-width="${(mj?rw*1.9:rw).toFixed(1)}"/>`}
 for(let lo=Math.floor(tl.lng/step)*step;lo<=br.lng+step;lo+=step){const x=toS({lat:M.lat,lng:lo}).x,mj=Math.round(lo/step)%4===0;g+=`<path d="M${x.toFixed(1)} 0V${M.h}" stroke-width="${(mj?rw*1.9:rw).toFixed(1)}"/>`}

 if(z>=13.6)[...PLACES,{name:'MASP',lat:-23.5614,lng:-46.6559}].forEach(p=>{const s=toS(p);if(s.x>-40&&s.x<M.w+40&&s.y>-10&&s.y<M.h+10)h+=`<circle cx="${s.x}" cy="${s.y}" r="3.5" fill="var(--muted)"/><text x="${s.x+7}" y="${s.y+4}">${p.name}</text>`});
 D.lines.forEach(l=>{const d=l.pts.map((p,i)=>{const s=toS(p);return(i?'L':'M')+s.x.toFixed(1)+' '+s.y.toFixed(1)}).join('');
  h+=`<path d="${d}" fill="none" stroke="var(--surface)" stroke-width="${l.w+4}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${l.c}" stroke-width="${l.w}" stroke-linecap="round" stroke-linejoin="round"${l.dash?' stroke-dasharray="2 9"':''}/>`});
 D.marks.forEach(m=>{const s=toS(m.p);const t=`transform="translate(${s.x.toFixed(1)} ${s.y.toFixed(1)})"`;
  if(m.k==='o')h+=`<g ${t}><circle r="13" fill="var(--surface)"/><circle r="8" fill="var(--brand)"/></g>`;
  if(m.k==='d')h+=`<g ${t}><rect x="-14" y="-14" width="28" height="28" rx="8" fill="var(--ink)" stroke="var(--surface)" stroke-width="3"/><rect x="-5" y="-5" width="10" height="10" rx="2" fill="var(--surface)"/></g>`;

  if(m.k==='c')h+=`<g ${t}><circle r="18" fill="var(--surface)"/><circle r="14" fill="var(--brand)"/><g transform="translate(-9 -9) scale(.75)" fill="none" stroke="var(--brand-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON.car}</g></g>`;
  if(m.k==='p')h+=`<g ${t}><circle class="pulse" r="60"/><circle r="9" fill="var(--brand)" stroke="var(--surface)" stroke-width="3"/></g>`});
 svg.innerHTML=h}
function fit(pts){size();const la=pts.map(p=>p.lat),lo=pts.map(p=>p.lng),a=Math.min(...la),b=Math.max(...la),c=Math.min(...lo),d=Math.max(...lo);
 M.lat=(a+b)/2;M.lng=(c+d)/2;let z=17;for(;z>12.5;z-=.25){M.z=z;const s1=toS({lat:b,lng:c}),s2=toS({lat:a,lng:d});if(s2.x-s1.x<M.w-110&&s2.y-s1.y<M.h-130)break}M.z=z;const c0=px(M,z),sh=unpx(c0.x,c0.y-12,z);M.lat=sh.lat;M.lng=sh.lng;draw()}
const clampZ=z=>Math.min(17.5,Math.max(12.5,z));
function zoomAt(f,sx,sy){const before=fromS(sx,sy);M.z=clampZ(M.z+f);const after=fromS(sx,sy);M.lat+=before.lat-after.lat;M.lng+=before.lng-after.lng;draw()}
const ptr=new Map();let moved=0,pd=0,following=false;
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;following=false;if(ptr.size===2){const[a,b]=[...ptr.values()];pd=Math.hypot(a.x-b.x,a.y-b.y)}});
svg.addEventListener('pointermove',e=>{const o=ptr.get(e.pointerId);if(!o)return;const dx=e.clientX-o.x,dy=e.clientY-o.y;
 if(ptr.size===1){moved+=Math.abs(dx)+Math.abs(dy);const c=px(M,M.z),n=unpx(c.x-dx,c.y-dy,M.z);M.lat=n.lat;M.lng=n.lng}
 ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptr.size===2){moved+=10;const[a,b]=[...ptr.values()],nd=Math.hypot(a.x-b.x,a.y-b.y),r=svg.getBoundingClientRect();if(pd)zoomAt(Math.log2(nd/pd),(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);pd=nd}
 draw()});
svg.addEventListener('pointerup',e=>{const was=ptr.has(e.pointerId);ptr.delete(e.pointerId);if(was&&moved<6&&ptr.size===0){const r=svg.getBoundingClientRect();onTap(fromS(e.clientX-r.left,e.clientY-r.top))}});
svg.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(-e.deltaY*.0025,e.clientX-r.left,e.clientY-r.top)},{passive:false});
$('#zin').onclick=()=>{M.z=clampZ(M.z+.7);draw()};
$('#zout').onclick=()=>{M.z=clampZ(M.z-.7);draw()};
$('#zfit').onclick=()=>fitCurrent();
new ResizeObserver(()=>draw()).observe(svg);

/* ---------- Estado ---------- */
const S={profile:'idoso',needs:new Set(['Rampa']),dest:null,type:'sh',pi:0,partner:null,big:false};
let view='request';
const timers=[];
const later=(f,ms)=>{const t=setTimeout(f,ms);timers.push(t);return t};
const clearTimers=()=>{timers.splice(0).forEach(t=>{clearTimeout(t);clearInterval(t)})};
function go(v){view=v;app.dataset.v=v;$$('.sheet .view').forEach(el=>el.hidden=el.id!=='v-'+v);$('#sheet').scrollTop=0}
function fitCurrent(){const pts=[ORIGIN];if(S.dest)pts.push(S.dest);if(view==='ride'&&RIDE.path)pts.push(...RIDE.path);fit(pts.length>1?pts:[{lat:ORIGIN.lat+.006,lng:ORIGIN.lng-.008},{lat:ORIGIN.lat-.006,lng:ORIGIN.lng+.008}])}
function prices(){const km=S.dest?plen(mkRoute(ORIGIN,S.dest)):0,ind=5+2.4*km;let sh=ind*.62;if(S.profile!=='comum')sh*=.9;return{km,ind,sh,save:ind-sh}}
function baseMap(){D.lines=[];D.marks=[{k:'o',p:ORIGIN}];if(S.dest){D.lines.push({pts:mkRoute(ORIGIN,S.dest),c:'var(--brand)',w:6});D.marks.push({k:'d',p:S.dest})}}
function updateRequest(){const P=prices();
 $('#pInd').textContent=S.dest?BRL(P.ind):'R$ —';$('#pSh').textContent=S.dest?BRL(P.sh):'R$ —';
 $('#rideHint').textContent=S.dest?`${P.km.toFixed(1).replace('.',',')} km · economia de ${BRL(P.save)} na compartilhada`:'Escolha um destino para ver os preços.';
 $$('#rides .opt').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===S.type));
 $$('#profile button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.profile));
 $$('#needs button').forEach(b=>b.setAttribute('aria-pressed',S.needs.has(b.dataset.n)));
 $('#needsBox').hidden=S.profile==='comum';$('#needsBox').style.display=S.profile==='comum'?'none':'flex';
 const o=ORIGIN,d=S.dest;$('#osm').href=d?`https://www.openstreetmap.org/directions?engine=fossgis_osrm_car&route=${o.lat}%2C${o.lng}%3B${d.lat}%2C${d.lng}`:'https://www.openstreetmap.org/#map=14/-23.5614/-46.6559'}
function setDest(p){S.dest=p;$('#to').value=p.name;$('#sugg').hidden=true;baseMap();updateRequest();fitCurrent()}
function onTap(p){if(view!=='request')return;setDest({name:'Ponto escolhido no mapa',lat:p.lat,lng:p.lng});toast('Destino definido no mapa')}
$('#to').addEventListener('input',e=>{const q=norm(e.target.value.trim()),list=q?PLACES.filter(p=>norm(p.name+' '+p.addr).includes(q)):PLACES.slice(0,4),box=$('#sugg');
 box.innerHTML=list.length?list.map((p,i)=>`<button data-i="${PLACES.indexOf(p)}">${p.name}<small>${p.addr}</small></button>`).join(''):'<button type="button">Nenhum lugar encontrado. Toque no mapa para escolher.</button>';box.hidden=false});
$('#to').addEventListener('focus',e=>e.target.dispatchEvent(new Event('input')));
$('#sugg').addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(b)setDest(PLACES[+b.dataset.i])});
$('#profile').addEventListener('click',e=>{const b=e.target.closest('button');if(b){S.profile=b.dataset.v;updateRequest()}});
$('#needs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){S.needs.has(b.dataset.n)?S.needs.delete(b.dataset.n):S.needs.add(b.dataset.n);updateRequest()}});
$('#rides').addEventListener('click',e=>{const b=e.target.closest('.opt');if(b){S.type=b.dataset.t;updateRequest()}});
$('#btnFont').onclick=()=>{S.big=!S.big;app.classList.toggle('big',S.big);$('#btnFont').setAttribute('aria-pressed',S.big);setTimeout(draw,50)};
$('#confirm').onclick=()=>{if(!S.dest){toast('Escolha um destino primeiro');$('#to').focus();return}S.type==='ind'?startRide(null):startSearch()};
/* ---------- Busca e parceiro ---------- */
const PRIO=[{n:'Maria',i:'M',c:'#A8466E',r:'4,9',tag:'Passageiro prioritário',need:'Precisa de rampa para embarcar'},
 {n:'João',i:'J',c:'#2F5F9E',r:'4,8',tag:'Passageiro prioritário',need:'Usa cadeira de rodas'},
 {n:'Lúcia',i:'L',c:'#6B42A3',r:'5,0',tag:'Passageiro prioritário',need:'Precisa de ajuda para embarcar'}];
const COMUM=[{n:'Rafael',i:'R',c:'#1F7359',r:'4,9',tag:'Passageiro comum',need:'Topa ajudar no embarque'},
 {n:'Camila',i:'C',c:'#9A5320',r:'4,8',tag:'Passageiro comum',need:'Viaja com pouca bagagem'}];
const avatar=(p,s=48)=>`<span class="av" style="background:${p.c};width:${s}px;height:${s}px" aria-hidden="true">${p.i}</span>`;
const star='<svg width="14" height="14" viewBox="0 0 24 24" fill="var(--amber)" aria-hidden="true">'+ICON.star+'</svg>';
function startSearch(){
 clearTimers();go('search');baseMap();D.marks=[{k:'p',p:ORIGIN},{k:'d',p:S.dest}];fitCurrent();
 const msgs=['Procurando passageiros no seu trajeto…','Verificando perfis prioritários próximos…','Confirmando a rota em comum…'];
 $('#v-search').innerHTML=`<h1>Buscando parceiro</h1><p class="hint" id="sMsg">${msgs[0]}</p><div class="bar"><i id="sBar" style="width:12%"></i></div>
 <div class="note"><span>${S.profile==='comum'?'Vamos parear você com um passageiro prioritário (idoso ou PcD) que segue um caminho parecido.':'Vamos parear você com um passageiro que topa ajudar no embarque e segue um caminho parecido.'}</span></div>
 <button class="ghost" id="sCancel">Cancelar busca</button>`;
 $('#sCancel').onclick=()=>{clearTimers();backToRequest();toast('Busca cancelada')};
 let i=0;const iv=setInterval(()=>{i++;$('#sMsg').textContent=msgs[Math.min(i,2)];$('#sBar').style.width=Math.min(100,12+i*30)+'%'},1000);timers.push(iv);
 later(()=>{clearInterval(iv);showMatch()},3300)}
function stopsFor(){const R=mkRoute(ORIGIN,S.dest);S.pickup=along(R,plen(R)*.3);S.dest2={lat:S.dest.lat,lng:S.dest.lng+.004};return R}
function showMatch(){
 const pool=S.profile==='comum'?PRIO:COMUM,p=pool[S.pi++%pool.length],P=prices(),R=stopsFor();S.partner=p;go('match');
 D.lines=[{pts:R,c:'var(--brand)',w:6},{pts:[S.dest,S.dest2],c:'var(--amber)',w:6,dash:1}];
 D.marks=[{k:'o',p:ORIGIN},{k:'n',p:S.pickup,n:p.i,c:p.c},{k:'d',p:S.dest},{k:'n',p:S.dest2,n:2,c:'#B26A00'}];
 fit([ORIGIN,S.dest,S.dest2]);
 const det=Math.max(2,Math.round(P.km*.6));
 $('#v-match').innerHTML=`<h1>Parceiro encontrado</h1>
 <div class="card">${avatar(p,56)}<div class="grow"><div style="display:flex;gap:8px;align-items:center"><b style="font-size:1.15em">${p.n}</b><span style="display:flex;gap:3px;align-items:center;font-weight:700">${star}${p.r}</span></div><span class="badge${S.profile==='comum'?'':' g'}">${p.tag}</span><span class="tiny">${p.need}</span></div></div>
 <div class="note"><span>${S.profile==='comum'?`Embarque com calma. ${p.n} pode precisar de alguns minutos a mais.`:`${p.n} topa ajudar no seu embarque.`} Desvio de cerca de ${det} min para buscar ${p.n}.</span></div>
 <div class="stops"><span><em>1</em>Você</span><i></i><span><em>2</em>${p.n}</span></div>
 <div class="price"><div><div class="tiny">Compartilhada</div><b>${BRL(P.sh)}</b></div><span class="save">Você economiza ${BRL(P.save)}</span></div>
 <button class="cta" id="mAcc">Aceitar</button><button class="ghost" id="mOther">Buscar outro parceiro</button><button class="ghost" id="mCan" style="border-color:transparent;color:var(--muted)">Cancelar</button>`;
 $('#mAcc').onclick=startRide;$('#mOther').onclick=startSearch;$('#mCan').onclick=()=>{backToRequest();toast('Corrida cancelada')}}
function backToRequest(){clearTimers();go('request');baseMap();updateRequest();fitCurrent()}

/* ---------- Corrida ---------- */
const RIDE={};
function startRide(){
 clearTimers();const ind=S.type==='ind',P=prices(),ds={lat:ORIGIN.lat+.006,lng:ORIGIN.lng+.004},seg1=mkRoute(ds,ORIGIN),R=stopsFor(),path=[...seg1,...R.slice(1)];
 Object.assign(RIDE,{path,L:plen(path),dO:plen(seg1),dP:ind?-1:plen(seg1)+plen(R)*.3,s:0,mult:1,boarded:false,picked:false,paid:ind?P.ind:P.sh,km:P.km,partner:ind?null:S.partner,ind});
 go('ride');renderRide();fit([...path,...(ind?[]:[S.dest2])]);
 const iv=setInterval(tickRide,100);timers.push(iv)}
function renderRide(){
 const p=RIDE.partner,rampa=S.needs.has('Rampa')&&S.profile!=='comum'||(p&&/rampa|cadeira/i.test(p.need));
 $('#v-ride').innerHTML=`<div class="eta"><div><div class="tiny" id="rPhase"></div><b id="rEta">—</b></div><button class="ghost" id="rSpeed" style="height:40px;padding:0 14px" aria-label="Alternar velocidade da simulação">Simulação 1x</button></div>
 <div class="bar"><i id="rBar"></i></div>
 <div class="card"><span class="av" style="background:var(--brand);color:var(--brand-ink)" aria-hidden="true">C</span><div class="grow"><div style="display:flex;gap:8px;align-items:center"><b>Carlos</b><span style="display:flex;gap:3px;align-items:center;font-weight:700">${star}4,8</span></div><span class="tiny">Carro branco · Placa ABC-1234</span>${rampa?'<span class="badge g">Veículo com rampa</span>':''}</div></div>
 ${p?`<div class="card">${avatar(p,44)}<div class="grow"><b>${p.n}</b><span class="badge${S.profile==='comum'?'':' g'}">${p.tag}</span></div><span class="tiny"><b>2ª parada</b></span></div>`:''}
 <div class="split"><div><small>Você paga</small><b>${BRL(RIDE.paid)}</b></div>${p?`<div><small>${p.n} paga</small><b>${BRL(RIDE.paid)}</b></div>`:''}</div>
 <div class="row"><button class="outline" id="rShare">Compartilhar viagem</button><button class="sos" id="rSos">SOS</button></div>
 <input id="shareTxt" readonly hidden class="field" style="width:100%" aria-label="Texto para compartilhar">
 <div class="panel" id="sosBox" hidden><b>Emergência</b><p>Polícia 190 · SAMU 192 · Central da mulher 180</p><button class="sos" id="sosNotify">Avisar contatos de confiança</button><button class="ghost" id="sosOk">Estou bem</button></div>
 <div class="lbl">Mensagem rápida ao Carlos</div>
 <div class="chips" id="quick"><button>Estou na portaria</button><button>Pode esperar um pouco</button><button>Estou chegando</button></div>
 <button class="ghost" id="rCancel" style="border-color:transparent;color:var(--muted)">Cancelar corrida</button>
 <div class="panel" id="canBox" hidden style="border-color:var(--line)"><b>Cancelar esta corrida?</b><div class="row"><button class="cta" id="canYes" style="height:48px">Sim, cancelar</button><button class="ghost" id="canNo">Continuar</button></div></div>`;
 $('#rSpeed').onclick=e=>{RIDE.mult=RIDE.mult===1?4:1;e.target.textContent='Simulação '+RIDE.mult+'x'};
 $('#rShare').onclick=async()=>{const txt=`Estou numa corrida compartilhada pelo Mitra com o motorista Carlos (placa ABC-1234). Destino: ${S.dest.name}. Rota: ${$('#osm').href}`;
  try{await navigator.clipboard.writeText(txt);toast('Link da viagem copiado')}catch(e){const i=$('#shareTxt');i.hidden=false;i.value=txt;i.select();toast('Copie o texto abaixo')}};
 $('#rSos').onclick=()=>{$('#sosBox').hidden=false;$('#sosBox').scrollIntoView({block:'nearest'})};
 $('#sosOk').onclick=()=>$('#sosBox').hidden=true;
 $('#sosNotify').onclick=()=>toast('Contatos avisados (simulação)');
 $('#quick').onclick=e=>{if(e.target.closest('button'))toast('Mensagem enviada ao Carlos')};
 $('#rCancel').onclick=()=>{$('#canBox').hidden=false;$('#canBox').scrollIntoView({block:'nearest'})};
 $('#canNo').onclick=()=>$('#canBox').hidden=true;
 $('#canYes').onclick=()=>{backToRequest();toast('Corrida cancelada')}}
function tickRide(){
 RIDE.s=Math.min(RIDE.L,RIDE.s+.014*RIDE.mult);const s=RIDE.s,car=along(RIDE.path,s),p=RIDE.partner;let ph;
 if(s<RIDE.dO)ph='Carlos está a caminho do seu embarque';
 else{if(!RIDE.boarded){RIDE.boarded=true;toast('Você embarcou. Boa viagem!')}
  if(p&&s<RIDE.dP)ph=`Indo buscar ${p.n}`;
  else{if(p&&!RIDE.picked){RIDE.picked=true;toast(`${p.n} embarcou`)}ph='Rumo ao seu destino'}}
 D.lines=[{pts:RIDE.path,c:'var(--brand)',w:6}];D.marks=[{k:'o',p:ORIGIN},{k:'d',p:S.dest}];
 if(p){D.lines.push({pts:[S.dest,S.dest2],c:'var(--amber)',w:6,dash:1});D.marks.push({k:'n',p:S.dest2,n:2,c:'#B26A00'});if(!RIDE.picked)D.marks.push({k:'n',p:S.pickup,n:p.i,c:p.c})}
 D.marks.push({k:'c',p:car});draw();
 const e=$('#rEta');if(e){e.textContent=Math.max(1,Math.ceil((RIDE.L-s)/.45))+' min';$('#rPhase').textContent=ph;$('#rBar').style.width=(s/RIDE.L*100)+'%'}
 if(s>=RIDE.L){clearTimers();toast('Você chegou ao destino');later(showRate,1100)}}

/* ---------- Avaliação e histórico ---------- */
let mem=[];
const loadRides=()=>{try{return JSON.parse(localStorage.getItem('mitra-rides')||'[]')}catch(e){return mem}};
const saveRide=r=>{try{const a=loadRides();a.unshift(r);localStorage.setItem('mitra-rides',JSON.stringify(a.slice(0,20)))}catch(e){mem.unshift(r)}};
function showRate(){
 go('rate');let rating=0;const tags=new Set();
 $('#v-rate').innerHTML=`<h1>Você chegou!</h1><div class="split"><div><small>Distância</small><b>${RIDE.km.toFixed(1).replace('.',',')} km</b></div><div><small>Você pagou</small><b>${BRL(RIDE.paid)}</b></div></div>
 <div class="lbl" style="text-align:center">Como foi a corrida com o Carlos?</div>
 <div class="stars" id="stars">${[1,2,3,4,5].map(n=>`<button data-n="${n}" aria-label="${n} ${n>1?'estrelas':'estrela'}" aria-pressed="false">★</button>`).join('')}</div>
 <div class="chips" id="rtags" style="justify-content:center"><button>Pontual</button><button>Carro confortável</button><button>Atencioso</button><button>Embarque tranquilo</button></div>
 <button class="cta" id="rDone">Concluir</button>`;
 $('#stars').onclick=e=>{const b=e.target.closest('button');if(!b)return;rating=+b.dataset.n;$$('#stars button').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.n<=rating))};
 $('#rtags').onclick=e=>{const b=e.target.closest('button');if(!b)return;const t=b.textContent;tags.has(t)?tags.delete(t):tags.add(t);b.setAttribute('aria-pressed',tags.has(t))};
 $('#rDone').onclick=()=>{if(!rating){toast('Escolha de 1 a 5 estrelas');return}
  saveRide({date:new Date().toLocaleDateString('pt-BR'),dest:S.dest.name,km:RIDE.km,paid:RIDE.paid,type:RIDE.ind?'Individual':'Compartilhada',partner:RIDE.partner?RIDE.partner.n:null,stars:rating});
  S.dest=null;$('#to').value='';backToRequest();toast('Avaliação enviada. Obrigado!')}}
$('#btnHist').onclick=()=>{
 if(view==='history'){backToRequest();return}
 if(view!=='request'){toast('Termine a corrida para ver o histórico');return}
 go('history');const a=loadRides();
 $('#v-history').innerHTML=`<h1>Suas corridas</h1>${a.length?a.map(r=>`<div class="hist"><div><b>${r.dest}</b><div class="tiny">${r.date} · ${r.type}${r.partner?' com '+r.partner:''} · ${r.km.toFixed(1).replace('.',',')} km</div></div><div style="text-align:right"><b>${BRL(r.paid)}</b><div class="tiny">${'★'.repeat(r.stars)}</div></div></div>`).join(''):'<p class="hint">Suas corridas aparecem aqui depois da primeira viagem. Peça uma corrida para começar.</p>'}<button class="cta" id="hBack">Pedir corrida</button>`;
 $('#hBack').onclick=backToRequest};

/* ---------- Início ---------- */
baseMap();updateRequest();go('request');
requestAnimationFrame(()=>{fitCurrent()});
</script>

</body></html>
