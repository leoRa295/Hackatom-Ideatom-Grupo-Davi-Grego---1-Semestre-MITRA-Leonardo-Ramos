<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>

:root[data-theme="dark"]{--bg:#0A1513;--surface:#142623;--ink:#E6F2EF;--muted:#9DB5B0;--line:#2A423E;--field:#1B312D;--brand:#34B39C;--brand-ink:#06211C;--brand-soft:#173B35;--brand-deep:#9BE3D4;--amber-soft:#3A2A0A;--amber-ink:#FFD98A;--amber-line:#6B4E14;--amber:#F0B340;--danger:#F97066;--danger-ink:#2B0A07;--map:#0F201D;--shadow:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14px;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;align-items:center;gap:12px}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.phone{--fs:1;font-size:calc(15px*var(--fs));width:min(390px,100%);height:min(844px,calc(100dvh - 40px));min-height:660px;position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:28px;display:flex;flex-direction:column}

.phone[data-v=ride] .mapwrap{flex-basis:320px}
.phone[data-v=history] .mapwrap,.phone[data-v=rate] .mapwrap,.phone[data-v=profile] .mapwrap{flex-basis:150px}
#map{position:relative;z-index:0;width:100%;height:100%;font-family:inherit}
.leaflet-bottom{bottom:26px}.leaflet-container a{color:var(--brand-deep)}
.mk{border-radius:50%;box-sizing:border-box}
.mk.o{width:22px;height:22px;margin:3px;background:var(--brand);border:4px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.4)}
.mk.d{width:24px;height:24px;margin:2px;border-radius:7px;background:#12332E;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.4)}
.mk.n{width:26px;height:26px;margin:1px;border:3px solid #fff;color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 6px rgba(0,0,0,.4)}
.mk.c{width:36px;height:36px;background:var(--brand);border:3px solid #fff;display:flex;align-items:center;justify-content:center;color:var(--brand-ink);box-shadow:0 1px 8px rgba(0,0,0,.45)}

@media (prefers-reduced-motion:reduce){.mk.p::after{animation:none}.mapwrap{transition:none}}
.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:500;pointer-events:none}
.top>*{pointer-events:auto}.top .gp{display:flex;gap:8px}
.round{width:44px;height:44px;border-radius:22px;border:0;background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px var(--shadow);font-weight:800;padding:0}
.brand{background:var(--surface);border-radius:22px;padding:0 14px;height:44px;display:flex;align-items:center;gap:8px;font-weight:800;box-shadow:0 2px 8px var(--shadow)}
.brand i{width:10px;height:10px;border-radius:5px;background:var(--brand)}
.zoom{position:absolute;right:12px;bottom:40px;display:flex;flex-direction:column;gap:6px;z-index:500}
.zoom .round{width:40px;height:40px;border-radius:12px}

.view{display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:1.45em;font-weight:800;letter-spacing:-.01em;text-wrap:balance}h2{margin:0;font-size:1.15em;font-weight:800}p{margin:0}
.lbl{font-size:.85em;font-weight:700;color:var(--muted);margin-bottom:-4px}.hint{font-size:.85em;color:var(--muted)}.tiny{font-size:.82em;color:var(--muted)}

.seg button{flex:1;font-weight:700}.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{border-radius:22px}
[aria-pressed=true]{border:2px solid var(--brand)!important;background:var(--brand-soft)!important;color:var(--brand-deep)!important;font-weight:800}

.opt .tag{position:absolute;top:-10px;right:10px;background:var(--amber-soft);color:var(--amber-ink);border:1px solid var(--amber-line);border-radius:10px;padding:1px 8px;font-size:.8em;font-weight:700}
.cta{height:56px;border-radius:16px;border:0;background:var(--brand);color:var(--brand-ink);font-size:1.06em;font-weight:800}
.ghost{height:48px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-weight:700}

.badge.g{background:var(--brand-soft);color:var(--brand-deep);border-color:var(--brand)}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:var(--brand-soft);color:var(--brand-deep);line-height:1.4}

.stops em{width:24px;height:24px;border-radius:12px;font-style:normal;display:flex;align-items:center;justify-content:center;font-size:.8em;color:#fff;background:var(--brand)}.stops span+i+span em{background:var(--amber)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .3s linear}

.stars{display:flex;gap:6px;justify-content:center}.stars button{width:48px;height:48px;border-radius:24px;border:1px solid var(--line);background:var(--surface);font-size:1.3em;color:var(--muted)}.stars button[aria-pressed=true]{color:var(--amber)}
.hist{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.sm{height:40px;padding:0 12px;border-radius:12px}
#toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:14px;font-weight:700;font-size:.9em;opacity:0;pointer-events:none;transition:all .25s;z-index:900;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.cap{font-size:.85em;color:var(--muted);text-align:center;max-width:390px}
</style></head><body>
<main class="phone" id="app" data-v="request">
  <div class="mapwrap" id="mapwrap">
    <div id="map" role="application" aria-label="Mapa real. Arraste para mover, toque para escolher o destino."></div>
    <div class="top">
      <button class="round" id="btnHist" aria-label="Histórico de corridas"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>
      <span class="brand"><i></i>Mitra</span>
      <span class="gp"><button class="round" id="btnUser" aria-label="Cadastro e passageiros"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg></button><button class="round" id="btnFont" aria-label="Aumentar tamanho do texto" aria-pressed="false">A+</button></span>
    </div>
    <div class="zoom">
      <button class="round" id="zloc" aria-label="Usar minha localização atual"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
      <button class="round" id="zin" aria-label="Aproximar mapa">+</button>
      <button class="round" id="zout" aria-label="Afastar mapa">−</button>
    </div>
  </div>
  <section class="sheet" id="sheet"><div class="grab"></div>
    <div class="view" id="v-request">
      <h1 id="hello">Para onde vamos?</h1>
      <div class="card" id="uCard"></div>
      <label class="field"><span class="dot"></span><input id="from" autocomplete="off" aria-label="Onde você está" placeholder="Digite o ponto de partida"></label>
      <label class="field"><span class="dot d"></span><input id="to" placeholder="Digite o destino, ex.: Havan Araçatuba" autocomplete="off" aria-label="Para onde vai"><button type="button" class="mic" id="mic" aria-label="Falar o destino" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button></label>
      <div class="sugg" id="sugg" hidden></div>
      <div class="chips" id="favs"></div>
      <div class="row" id="favSave" hidden><button class="ghost sm" id="svCasa">Salvar como Casa</button><button class="ghost sm" id="svTrab">Salvar como Trabalho</button></div>
      <div class="rides" id="rides">
        <button class="opt" data-t="ind" aria-pressed="false"><span>Individual</span><b id="pInd">R$ —</b></button>
        <button class="opt" data-t="sh" aria-pressed="true"><span>Compartilhada</span><b id="pSh">R$ —</b><span class="tag">Mais barata</span></button>
      </div>
      <p class="hint" id="rideHint">Escolha um destino para ver os preços.</p>
      <a class="link" id="osm" href="https://www.openstreetmap.org" target="_blank" rel="noopener">Ver esta rota no OpenStreetMap</a>
      <button class="cta" id="confirm">Confirmar corrida</button>
    </div>
    <div class="view" id="v-search" hidden></div><div class="view" id="v-match" hidden></div><div class="view" id="v-ride" hidden></div>
    <div class="view" id="v-rate" hidden></div><div class="view" id="v-history" hidden></div><div class="view" id="v-profile" hidden></div>
  </section>
  <div id="toast" role="status" aria-live="polite"></div>
</main>
<p class="cap">Mapa e rotas reais (OpenStreetMap). Parceiros, motorista e pagamento ainda são simulados.</p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],app=$('#app');
const BRL=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rad=x=>x*Math.PI/180;
const hav=(a,b)=>{const dl=rad(b.lat-a.lat),dg=rad(b.lng-a.lng),q=Math.sin(dl/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dg/2)**2;return 12742*Math.asin(Math.sqrt(q))};
const plen=p=>p.slice(1).reduce((s,q,i)=>s+hav(p[i],q),0);
function along(p,d){let acc=0;for(let i=1;i<p.length;i++){const l=hav(p[i-1],p[i]);if(acc+l>=d||i===p.length-1){const t=l?Math.min(1,Math.max(0,(d-acc)/l)):1;return{lat:p[i-1].lat+(p[i].lat-p[i-1].lat)*t,lng:p[i-1].lng+(p[i].lng-p[i-1].lng)*t}}acc+=l}return p[p.length-1]}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2800)}
const mem={},store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return k in mem?mem[k]:d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}}};
const BR='#0B6E5F',AM='#B26A00',PL={idoso:'Idoso',pcd:'PcD',comum:'Comum'},COLORS=['#A8466E','#2F5F9E','#6B42A3','#1F7359','#9A5320'];
const colorOf=n=>COLORS[[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%COLORS.length];
const ICON={car:'<path d="M5 17v-4l2-5h10l2 5v4M5 17h14M7.5 17v2M16.5 17v2M7 13h10"/>',star:'<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>'};
const star='<svg width="14" height="14" viewBox="0 0 24 24" fill="var(--amber)" aria-hidden="true">'+ICON.star+'</svg>';
const avatar=(p,s=48)=>`<span class="av" style="background:${p.c};width:${s}px;height:${s}px" aria-hidden="true">${esc(p.i)}</span>`;

/* ---------- Usuários ---------- */
let users=store.get('mitra-users',[]),activeId=store.get('mitra-active',null);
const U=()=>users.find(u=>u.id===activeId)||users[0]||null;
const saveUsers=()=>{store.set('mitra-users',users);store.set('mitra-active',activeId)};
const prof=()=>(U()||{}).profile||'idoso',needs=()=>new Set((U()||{}).needs||[]);
const uAv=(u,s=44)=>avatar({i:(u.name[0]||'?').toUpperCase(),c:colorOf(u.name)},s);

/* ---------- Mapa real ---------- */
let ORIGIN={name:'Centro de Araçatuba',lat:-21.2089,lng:-50.4328,real:false},R=null;
const map=L.map('map',{zoomControl:false,center:[ORIGIN.lat,ORIGIN.lng],zoom:15});
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
map.attributionControl.setPrefix(false).setPosition('bottomleft');
const lay=L.layerGroup().addTo(map),ll=p=>[p.lat,p.lng],D={lines:[],marks:[]};
const ico=(h,s=28)=>L.divIcon({className:'',html:h,iconSize:[s,s],iconAnchor:[s/2,s/2]});
const MK={o:()=>ico('<div class="mk o"></div>'),d:()=>ico('<div class="mk d"></div>'),n:(t,c)=>ico(`<div class="mk n" style="background:${c}">${esc(t)}</div>`),p:()=>ico('<div class="mk p"></div>',26),
 c:()=>ico(`<div class="mk c"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON.car}</svg></div>`,36)};
function paint(){lay.clearLayers();D.lines.forEach(l=>{const a=l.pts.map(ll);L.polyline(a,{color:'#fff',weight:l.w+4,opacity:.9}).addTo(lay);L.polyline(a,{color:l.c,weight:l.w,dashArray:l.dash?'2 10':null}).addTo(lay)});
 D.marks.forEach(m=>L.marker(ll(m.p),{icon:MK[m.k](m.n,m.c),interactive:false,keyboard:false}).addTo(lay))}
function fit(pts){if(pts.length<2)return map.setView(ll(pts[0]),16);map.fitBounds(L.latLngBounds(pts.map(ll)),{paddingTopLeft:[30,70],paddingBottomRight:[60,50],maxZoom:17,animate:false})}
function baseMap(){D.lines=S.dest?[R?{pts:R.pts,c:BR,w:6}:{pts:[ORIGIN,S.dest],c:BR,w:4,dash:1}]:[];D.marks=[{k:'o',p:ORIGIN}];if(S.dest)D.marks.push({k:'d',p:S.dest});paint()}
function fitCur(){const pts=[ORIGIN];if(S.dest)pts.push(...(R?R.pts:[S.dest]));fit(pts.length>1?pts:[ORIGIN])}
$('#zin').onclick=()=>map.zoomIn();$('#zout').onclick=()=>map.zoomOut();$('#zloc').onclick=()=>locate();
new ResizeObserver(()=>map.invalidateSize()).observe($('#map'));

/* ---------- Serviços (busca, rota, endereço) ---------- */
async function geo(q){const o=ORIGIN,vb=`${o.lng-.6},${o.lat+.6},${o.lng+.6},${o.lat-.6}`;
 const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&countrycodes=br&accept-language=pt-BR&viewbox=${vb}&q=${encodeURIComponent(q)}`,{signal:AbortSignal.timeout(9000)});
 return(await r.json()).map(x=>{const a=x.display_name.split(', ');return{name:x.name||a[0],addr:a.slice(1,4).join(', '),lat:+x.lat,lng:+x.lon}})}
async function revGeo(p){try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&accept-language=pt-BR&lat=${p.lat}&lon=${p.lng}`,{signal:AbortSignal.timeout(8000)}),j=await r.json(),a=j.address||{};

 const d={profile:e.profile,needs:new Set(e.needs||[]),pay:e.pay||'Pix'},c=e.contact||{};
 const pr=(id,items,cur)=>`<div class="seg" id="${id}">${items.map(([v,t])=>`<button data-v="${v}" aria-pressed="${v===cur}">${t}</button>`).join('')}</div>`;
 $('#v-profile').innerHTML=`<h1>${users.length?'Passageiros':'Crie seu cadastro'}</h1>
 ${users.length?users.map(u=>`<div class="card">${uAv(u)}<div class="grow"><b>${esc(u.name)}</b><span class="tiny">${PL[u.profile]}${u.id===activeId?' · usando agora':''}</span></div><button class="ghost sm" data-e="${u.id}">Editar</button>${u.id!==activeId?`<button class="outline sm" data-u="${u.id}">Usar</button>`:''}</div>`).join('')+'<button class="ghost" id="uNew">Adicionar passageiro</button>':'<p class="hint">Cadastre quem vai viajar. Você pode ter mais de um passageiro, por exemplo você e seus pais.</p>'}
 <h2>${e.id==='new'?'Novo passageiro':'Editar passageiro'}</h2>
 <div class="lbl">Nome</div><label class="field"><input id="fName" value="${esc(e.name)}" maxlength="40" autocomplete="name" placeholder="Como devemos chamar?" aria-label="Nome do passageiro"></label>
 <div class="lbl">Perfil</div>${pr('fProf',[['idoso','Idoso'],['pcd','PcD'],['comum','Comum']],d.profile)}
 <div id="fNeedsBox" ${d.profile==='comum'?'hidden':''} style="display:flex;flex-direction:column;gap:8px"><div class="lbl">Preciso de</div><div class="chips" id="fNeeds">${['Rampa','Ajuda para embarcar','Espaço para cadeira'].map(n=>`<button data-n="${n}" aria-pressed="${d.needs.has(n)}">${n}</button>`).join('')}</div></div>
 <div class="lbl">Contato de confiança (recebe o aviso da viagem e do SOS)</div>
 <label class="field"><input id="fCn" value="${esc(c.name||'')}" placeholder="Nome do contato" aria-label="Nome do contato" maxlength="40"></label>
 <label class="field"><input id="fCp" type="tel" inputmode="tel" value="${esc(c.phone||'')}" placeholder="Telefone com DDD" aria-label="Telefone do contato"></label>
 <div class="lbl">Pagamento</div>${pr('fPay',[['Pix','Pix'],['Dinheiro','Dinheiro'],['Cartão','Cartão']],d.pay)}
 <button class="cta" id="fSave">Salvar e pedir corrida</button>${e.id!=='new'?'<button class="ghost" id="fDel">Excluir passageiro</button>':''}`;
 const seg=(id,fn)=>{$('#'+id).onclick=ev=>{const b=ev.target.closest('button');if(!b)return;fn(b.dataset.v);$$('#'+id+' button').forEach(x=>x.setAttribute('aria-pressed',x===b))}};
 seg('fProf',v=>{d.profile=v;$('#fNeedsBox').hidden=v==='comum'});seg('fPay',v=>d.pay=v);
 $('#fNeeds').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;const n=b.dataset.n;d.needs.has(n)?d.needs.delete(n):d.needs.add(n);b.setAttribute('aria-pressed',d.needs.has(n))};
 $('#v-profile').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.e){editId=b.dataset.e;showProfile()}
  if(b.dataset.u){activeId=b.dataset.u;saveUsers();S.dest=null;R=null;$('#to').value='';backToRequest();toast('Passageiro trocado')}
  if(b.id==='uNew'){editId='new';showProfile()}
  if(b.id==='fDel'){if(!b.dataset.ok){b.dataset.ok=1;b.textContent='Toque de novo para excluir';return}
   store.set('mitra-rides',loadRides().filter(r=>r.uid!==e.id));users=users.filter(x=>x.id!==e.id);activeId=users[0]?users[0].id:null;saveUsers();editId=null;users.length?backToRequest():showProfile();toast('Passageiro excluído')}
  if(b.id==='fSave'){const name=$('#fName').value.trim();if(!name){toast('Digite o nome do passageiro');$('#fName').focus();return}
   const ph=$('#fCp').value.trim();if(ph&&digits(ph).length<10){toast('Telefone com DDD, ex.: 18 99999-9999');$('#fCp').focus();return}
   const o={...(e.id==='new'?{id:'u'+Date.now(),fav:{}}:e),name,profile:d.profile,needs:[...d.needs],contact:{name:$('#fCn').value.trim(),phone:ph},pay:d.pay};
   e.id==='new'?users.push(o):users=users.map(x=>x.id===o.id?o:x);activeId=o.id;saveUsers();editId=null;S.dest=null;R=null;$('#to').value='';backToRequest();toast('Cadastro salvo')}}}

/* ---------- Início ---------- */
setBig(store.get('mitra-big',false));
$('#from').value=ORIGIN.name;baseMap();updateRequest();go('request');fitCur();
if(!users.length)showProfile();
locate();
</script></body></html>
